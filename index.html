<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Щенячий патруль: Собери мусор!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Стартовый экран -->
  <div id="startScreen" class="screen">
    <h1>Выбери щенка!</h1>
    <div id="puppySelect">
      <img src="images/rocky.png" data-puppy="rocky" alt="Рокки">
      <img src="images/chase.png" data-puppy="chase" alt="Чейз">
      <img src="images/marshall.png" data-puppy="marshall" alt="Маршалл">
      <img src="images/rubble.png" data-puppy="rubble" alt="Раббл">
      <img src="images/skye.png" data-puppy="skye" alt="Скай">
    </div>

    <h2 style="margin-top: 20px; font-size: 20px;">Режим игры:</h2>
    <div id="modeSelect">
      <button class="mode-btn active" data-mode="falling">Падает сверху</button>
      <button class="mode-btn" data-mode="to-center">Со всех сторон</button>
      <button class="mode-btn" data-mode="static">Неподвижный мусор</button>
      <button class="mode-btn" data-mode="maze">Лабиринт</button>
      <button class="mode-btn" data-mode="maze-line">Проведи пальцем</button>
    </div>

    <button id="startGameBtn" class="btn start-btn" disabled>Начать игру</button>
  </div>

  <!-- Игровой экран -->
  <div id="gameScreen" class="screen hidden">
    <div id="score">Счёт: 0</div>
    <div id="timer">Время: 30</div>
    <div id="volumeBtn" class="volume-btn">🔊</div>
    <div id="player"></div>
    <div id="maze"></div>
    <div id="mazeLineContainer" class="hidden">
  <img id="mazeLineImg" src="images/maze-line.png" alt="Лабиринт-линия">
  <canvas id="mazeLineCanvas"></canvas>
</div>
    <!-- Джойстик УДАЛЕН -->
  </div>

  <!-- Финальный экран -->
  <div id="endScreen" class="screen hidden">
    <h2>Игра окончена!</h2>
    <p>Ты собрал <span id="finalScore">0</span> мусора! 🐾</p>
    <button class="btn" id="restartBtn">Играть снова</button>
    <button class="btn exit" id="exitBtn">Выход</button>
  </div>

  <!-- Звуки -->
  <audio id="soundCollect" src="sounds/collect.mp3" preload="auto"></audio>
  <audio id="soundStart" src="sounds/game-start.mp3" preload="auto"></audio>
  <audio id="soundEnd" src="sounds/game-end.mp3" preload="auto"></audio>
  <audio id="soundBgMusic" src="sounds/bg-music.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
